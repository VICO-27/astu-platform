services:
  # ── Django Web Server ─────────────────────────────────────────────────────
  - type: web
    name: astu-platform-api
    env: python
    buildCommand: >-
      apt-get install -y libmagic1 &&
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: astu-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: astu-platform-redis
          type: redis
          property: connectionString
      - key: ALLOWED_HOSTS
        value: astu-platform-api.onrender.com
      - key: COOKIE_SECURE
        value: "True"
      # Add GROQ_API_KEY, CLOUDINARY_*, GOOGLE_* in Render dashboard

  # ── Celery Worker ─────────────────────────────────────────────────────────
  - type: worker
    name: astu-platform-worker
    env: python
    buildCommand: >-
      apt-get install -y libmagic1 &&
      pip install -r requirements.txt
    startCommand: celery -A core worker -l info --concurrency 2
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: DATABASE_URL
        fromDatabase:
          name: astu-platform-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: astu-platform-redis
          type: redis
          property: connectionString

databases:
  - name: astu-platform-db
    databaseName: astu_db
    user: astu_user
    plan: free

  - name: astu-platform-redis
    plan: free
    type: redis
